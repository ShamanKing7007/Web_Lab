version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: woodenButWithSoul_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nix
      POSTGRES_PASSWORD: sews
      POSTGRES_DB: "woodenButWithSoul"
    ports:
      - "5432:5432"
    volumes:
      - woodenButWithSoul_data:/var/lib/postgresql/data
    networks:
      - woodenButWithSoul_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nix"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: woodenButWithSoul_app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - woodenButWithSoul_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: woodenButWithSoul_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - woodenButWithSoul_network
    volumes:
      - woodenButWithSoul_pgadmin:/var/lib/pgadmin

volumes:
  woodenButWithSoul_data:
  woodenButWithSoul_pgadmin:

networks:
  woodenButWithSoul_network:
