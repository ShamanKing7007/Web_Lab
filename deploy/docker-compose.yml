services:
  postgres:
    image: postgres:16
    container_name: web_labs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sews}
      POSTGRES_DB: ${DB_NAME:-Web_Labs}
    ports:
      - "5432:5432"
    volumes:
      - web_labs_data:/var/lib/postgresql/data
    networks:
      - web_labs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nix} -d ${DB_NAME:-Web_Labs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: web_labs_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - web_labs_redis:/data
    networks:
      - web_labs_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: web_labs_app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL_DEFAULT: ${CACHE_TTL_DEFAULT:-300}
      PORT: 4200
      APP_ENV: ${APP_ENV:-development}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      CALLBACK_URL: ${CALLBACK_URL}
      OAUTH_PROVIDER: ${OAUTH_PROVIDER}
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_labs_network
    volumes:
      - ./docs:/app/docs
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: web_labs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - web_labs_network
    volumes:
      - web_labs_pgadmin:/var/lib/pgadmin

volumes:
  web_labs_data:
  web_labs_redis:
  web_labs_pgadmin:

networks:
  web_labs_network:
