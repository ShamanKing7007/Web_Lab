version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: web_labs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sews}
      POSTGRES_DB: ${DB_NAME:-Web_Labs}
    ports:
      - "5432:5432"
    volumes:
      - web_labs_data:/var/lib/postgresql/data
    networks:
      - web_labs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: web_labs_app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web_labs_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: web_labs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - web_labs_network
    volumes:
      - web_labs_pgadmin:/var/lib/pgadmin

volumes:
  web_labs_data:
  web_labs_pgadmin:

networks:
  web_labs_network:
